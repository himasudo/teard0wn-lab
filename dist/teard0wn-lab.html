 id:'heap-overflow',track:'vulnerabilities',title:'Overflowing a chunk into the next header',subtitle:'The write that passes the array corrupts allocator metadata.',duration:50,difficulty:'Advanced',input:'2',inputLabel:'Write index into chunk0 (RDI)',mode:'repair',goal:'Write only within chunk0’s two data slots and return the intact next-chunk size 32; indices 2 and 3 must not reach the adjacent chunk header. (CWE-787 / CWE-122.)',
 starter:`entry:
    cmp rdi, 4
    jae invalid

    mov rdx, 0xdeadbeef
    mov qword ptr [rsi+rdi*8], rdx

 sections:[section('A heap is objects next to their bookkeeping','chunk0 holds two data slots. Immediately after it in memory sits the next chunk’s header: a size field and an in-use flag that the allocator reads to walk and free chunks. The guard here bounds the write to 4 slots, but chunk0 owns only 2, so indices 2 and 3 land on that header.','Real allocators store chunk metadata inline, right beside the data they manage. An overflow out of one chunk therefore writes into the next chunk’s size and flags — the exact fields free() and malloc() trust. This is why a heap overflow is a metadata-corruption primitive, not just a lost byte.'),
 section('Corrupt the size the allocator trusts','Enter 2 and run. The write lands on the next chunk’s size field and replaces 32 with 0xdeadbeef. A later free or coalesce would read that attacker-chosen size and treat memory far beyond the chunk as one free block — the root of overlapping-chunk and unlink attacks. Index 3 corrupts the in-use flag instead, with the same class of consequence.','The fix is a correct per-chunk bound, but the deeper reason allocators defend this: glibc added safe-unlinking (checking that FD→bk and BK→fd point back), next-size sanity checks, and the in-use-bit test precisely because a forged size or pointer here yields an arbitrary write.'),
 section('Fix: bound the write to the object’s own size','chunk0 has two slots, so reject any index of 2 or more before the store (CMP RDI, 2 / JAE). The header is then unreachable from this write. Verify both valid slots keep the next size at 32 and every out-of-range index returns the error.','Spatial safety on the heap means every write stays inside the object’s own allocation. The allocator’s integrity checks are a backstop, not a substitute: the write should never reach the metadata in the first place.')],
 hints:['chunk0 owns two slots; the next chunk’s header follows immediately.','Reject index 2 and above before the store (CMP RDI, 2 / JAE).','Index 2 lands on the size field, index 3 on the in-use flag.'],
 quiz:{q:'Why is overflowing into the next chunk’s size field dangerous?',options:['It only wastes a few bytes of heap.','The allocator trusts that size to walk and free memory, so a forged value yields overlapping or arbitrary allocations.','The CPU faults on any heap write.'],answer:1,why:'free() and malloc() read the inline size to find adjacent chunks; a forged size makes the allocator hand out or coalesce memory it should not — a classic arbitrary-write primitive.'},refs:['intel','memory']
},

 id:'aslr-leak',track:'vulnerabilities',title:'An out-of-bounds read that leaks a pointer',subtitle:'One leaked address is enough to undo ASLR.',duration:45,difficulty:'Advanced',input:'4',inputLabel:'Read index (RDI)',mode:'repair',goal:'Return buf[i] for indices 0–3 and UINT64_MAX otherwise; index 4 must not read the saved pointer that follows the array. (CWE-125 / CWE-200.)',

 sections:[section('Not all out-of-bounds reads are equal','The four-element array is followed in memory by a saved pointer — here 0x555555554040, a code or library address. The guard allows indices up to 4, so index 4 reads that pointer and returns it. No corruption occurs; the function simply hands out a value it should never expose.','An out-of-bounds read that lands on ordinary data is a minor leak. One that lands on a pointer is a different severity: it reveals a runtime address the caller was never meant to see.'),
 section('Why one pointer defeats ASLR','Address-space layout randomization relocates code and libraries to a random base each run, so an attacker cannot hardcode target addresses. But offsets within a module are fixed. Leaking a single pointer reveals the base, and every other address in that module follows by a known offset.','Enter 4 and run: the function returns 0x555555554040. In a real exploit that value is reduced by its known offset to recover the load base, which then locates gadgets, functions, and the stack — turning a read bug into the precondition for a reliable control-flow attack.'),
 section('Fix: bound the read to the public array','Reject indices of 4 and above before the load (CMP RDI, 4 / JAE), so the adjacent pointer is never readable through this function. Verify the four valid reads and that index 4 returns the error instead of the address.','Information-disclosure bugs are rated below memory corruption, but they are the half of the chain that makes corruption usable. An OOB read next to a pointer, a cookie, or a stack canary is often the first step of a modern exploit.')],
 hints:['The array has four public entries; the saved pointer sits at index 4.','Reject index 4 and above before the load.','Leaking the pointer reveals the module base and undoes ASLR.'],
 quiz:{q:'Why does leaking one pointer matter under ASLR?',options:['It crashes the randomization.','Fixed intra-module offsets let the attacker derive every other address from one leaked base.','Pointers are always zero under ASLR.'],answer:1,why:'ASLR randomizes the base but not the offsets within a module, so one leaked address reveals the base and, by known offsets, everything else.'},refs:['intel','memory']
},

 id:'double-free',track:'vulnerabilities',title:'Freeing the same chunk twice',subtitle:'A missing state check puts one chunk on the free list twice.',duration:50,difficulty:'Advanced',input:'1',inputLabel:'Extra frees of the same chunk (RDI)',mode:'repair',goal:'free() must be idempotent on an already-freed chunk: the free-list count stays 1 no matter how many times the chunk is freed. (CWE-415.)',
 starter:`entry:
    lea rsi, [chunk]
    call free_chunk
    mov rcx, rdi
loop1:
    cmp rcx, 0
    je done
    call free_chunk
    sub rcx, 1
    jmp loop1
done:
    mov rax, qword ptr [flcount]

free_chunk:

    mov rax, qword ptr [flcount]

 solution:`entry:

 sections:[section('free() changes an object’s state','Freeing a chunk records it on a free list so the allocator can hand it back later. The harness frees one chunk, then frees it RDI more times. free_chunk marks the chunk and increments the free-list count, but never checks whether the chunk was already free.','The invariant free() must preserve is that a live chunk is freed exactly once. Freeing an already-free chunk is not a harmless repeat: it records the same memory on the free list twice.'),
 section('Why a double free becomes an arbitrary write','Enter 1 and run: the count reaches 2, so the same chunk sits on the free list twice. The next two allocations both return it — two live pointers to one block. Writing through one corrupts the other’s object, and on real allocators the freed chunk’s own bytes hold the free-list pointer, so controlling that aliased memory lets an attacker redirect where the allocator returns next.','This is CWE-415, and it is why glibc added an explicit check that the chunk being freed is not already at the head of its bin (“double free or corruption (fasttop)”), plus tcache key tags and safe-linking. All answer the question this lab does: has this chunk already been freed?'),
 section('Fix: reject a free of an already-free chunk','Have free_chunk read the chunk’s freed flag and return without touching the list when it is already set. The count then stays 1 however many times the chunk is freed. Verify zero, one, and several extra frees.','The defensive pattern is a per-object state check before the state transition. Allocators encode it as a flag, a key, or a freed-list scan; the principle is that free() must be a no-op on memory that is already free.')],
 hints:['free_chunk never checks whether the chunk is already freed.','Read the freed flag at the start and return early (jump to skip) if it is set.','A correct free list holds each chunk at most once, so the count stays 1.'],
 quiz:{q:'Why can a double free lead to an arbitrary write?',options:['It doubles the heap size.','The chunk is returned by two allocations, and its freed bytes hold allocator pointers an attacker can then control.','Freeing twice zeroes the chunk.'],answer:1,why:'Two allocations alias one chunk; because a freed chunk stores the free-list pointer in its own data, controlling that aliased memory redirects future allocations.'},refs:['intel','memory']
},

 sections:[section('Two types, one layout, a tag to tell them apart','Both objects start with a tag, then an eight-byte payload. For the pointer type (tag 1) the payload is an address to dereference; for the integer type (tag 0) it is a plain number, 0x414243444546. The handler reads the payload and dereferences it without ever checking the tag.','Type confusion is treating memory of one type as if it were another. Here the two types share a shape, so the wrong interpretation is silent: the code reads the integer type’s number as if it were a valid pointer.'),

// micro.js
// A small, explicit microarchitecture model: data caches, TLBs, and a branch
// predictor, driven by the addresses and branches the engine actually executes.
// Sizes follow the Memory Systems Lab's model machine. Latencies are
// REPRESENTATIVE UNLOADED cycle counts for teaching, not measurements of any
// real processor and not a timing simulation (no queueing, contention, MLP, or
// prefetch). The point is to make locality and prediction visible, not to
// predict wall-clock time.

const LINE = 64;        // cache line / coherence granule, bytes
const PAGE = 4096;      // page size, bytes

// Representative unloaded latencies, in cycles.
const LAT = {base:1, L1:4, L2:12, L3:40, DRAM:200, tlbL2:7, walk:30, mispredict:15};

// Set-associative cache with true LRU. `unit` is the block size (LINE for data,
// PAGE for a TLB). `entries` total blocks; `ways` associativity (ways===entries
// gives a fully-associative structure with one set).
class SetAssoc {
  constructor(entries, ways, unit) {
    this.ways = ways; this.unit = unit; this.sets = entries / ways;
    if (!Number.isInteger(this.sets)) throw new Error('entries must be a multiple of ways');
    this.reset();
  }
  reset() { this.tag = Array.from({length: this.sets}, () => []); } // [0] = most-recent
  // Access the block containing `addr`; returns true on hit. LRU updated, with
  // one block installed on a miss.
  access(addr) {
    const block = Math.floor(addr / this.unit);
    const set = ((block % this.sets) + this.sets) % this.sets;
    const tag = Math.floor(block / this.sets);
    const line = this.tag[set];
    const i = line.indexOf(tag);
    if (i >= 0) { line.splice(i, 1); line.unshift(tag); return true; }
    line.unshift(tag); if (line.length > this.ways) line.pop();
    return false;
  }
}

class Microarch {
  constructor() {
    // Data cache hierarchy (model machine): 48 KiB L1d 12-way, 512 KiB L2 8-way,
    // 4 MiB L3 16-way. Accessing a level installs on miss, modelling inclusive fills.
    this.L1 = new SetAssoc(768, 12, LINE);     // 48 KiB
    this.L2 = new SetAssoc(8192, 8, LINE);     // 512 KiB
    this.L3 = new SetAssoc(65536, 16, LINE);   // 4 MiB
    // TLBs: 64-entry fully-associative L1 DTLB, 512-entry 8-way L2 TLB, 4 KiB pages.
    this.dtlb = new SetAssoc(64, 64, PAGE);
    this.stlb = new SetAssoc(512, 8, PAGE);
    // Branch predictor: 1024-entry 2-bit bimodal (counter 0..3, >=2 predicts taken).
    this.bp = new Uint8Array(1024).fill(1);
    this.reset();
  }
  reset() {
    for (const c of [this.L1, this.L2, this.L3, this.dtlb, this.stlb]) c.reset();
    this.bp.fill(1);
    this.cycles = 0;
    this.stats = {insns:0, loads:0, stores:0, L1:0, L2:0, L3:0, DRAM:0,
                  tlbHit:0, tlbL2:0, walks:0, branches:0, mispred:0};
    this.last = null; // per-step summary for the UI
  }
  _data(addr, write) {
    // Translate first, then look up the line.
    let tlb;
    if (this.dtlb.access(addr)) { tlb = 'L1'; this.stats.tlbHit++; }
    else if (this.stlb.access(addr)) { tlb = 'L2'; this.stats.tlbL2++; this.cycles += LAT.tlbL2; }
    else { tlb = 'walk'; this.stats.walks++; this.cycles += LAT.walk; }
    let level;
    if (this.L1.access(addr)) { level = 'L1'; this.cycles += LAT.L1; }
    else if (this.L2.access(addr)) { level = 'L2'; this.cycles += LAT.L2; }
    else if (this.L3.access(addr)) { level = 'L3'; this.cycles += LAT.L3; }
    else { level = 'DRAM'; this.cycles += LAT.DRAM; }
    this.stats[level]++;
    this.stats[write ? 'stores' : 'loads']++;
    return {addr, write, level, tlb};
  }
  _branch(pc, taken) {
    const i = (pc >>> 0) & 1023, c = this.bp[i], predicted = c >= 2, correct = predicted === taken;
    this.bp[i] = taken ? Math.min(3, c + 1) : Math.max(0, c - 1);
    this.stats.branches++;
    if (!correct) { this.stats.mispred++; this.cycles += LAT.mispredict; }
    return {pc, taken, predicted, correct};
  }
  // Observe one retired instruction from the engine (see machine step records).
  observe(machine) {
    this.stats.insns++; this.cycles += LAT.base;
    const accesses = (machine.lastAccesses || []).map(a => this._data(a.address, a.write));
    const branch = machine.lastBranch ? this._branch(machine.lastBranch.pc, machine.lastBranch.taken) : null;
    this.last = {accesses, branch};
    return this.last;
  }
}

// fuzzer.js
// A small coverage-guided fuzzer over the engine. It runs a compiled target
// with a 32-bit input in EDI, records the set of instruction addresses the run
// executed as its coverage, and keeps any input that reached a new address.
// Mutating from that growing corpus lets it fall through byte-at-a-time gates
// that blind random search could never pass. A crash is an engine fault
// (out-of-bounds access, divide by zero, ...).

// Execute one input; return the covered instruction addresses and whether it faulted.
function coverageRun(program,input){
  const m=new Machine(program,{rdi:unsigned(BigInt(input>>>0),64)});
  const cov=new Set();let budget=100000;
  while(budget-->0&&!['halted','fault'].includes(m.status)){cov.add(Number(m.rip));if(!m.step())break;}
  return {cov,fault:m.status==='fault',reason:m.reason,ret:Number(unsigned(m.regs[0],32))};

// Mutate a 32-bit value. Byte substitution dominates, which is what cracks
// byte-compared gates; bit flips and small deltas cover arithmetic conditions.
function mutate(x,rng=Math.random){
  x=x>>>0;const r=rng();
  if(r<0.5){const sh=(r*8|0)%4*8,val=(rng()*256)|0;return ((x&~(0xff<<sh))|(val<<sh))>>>0;}
  if(r<0.8)return (x^(1<<((rng()*32)|0)))>>>0;
  if(r<0.95)return (x+((rng()*5|0)-2))>>>0;
  return (rng()*0x100000000)>>>0;
}

// actually gives you. Each thread writes stores into a private FIFO store
// buffer; a buffered store becomes visible to other threads only when it drains
// to memory, and a thread's own loads see its buffered stores first. The one
// reordering this allows -- a later load passing an earlier store to a different
// address -- is exactly what the SB litmus test exposes. MFENCE drains the
// buffer, which is why it restores the stronger ordering.
//

// set of final register tuples that are reachable. That set is the ground truth
// the lab shows: a result is "allowed" iff it is reachable here. The known
// outcomes of the classic tests are checked in tests/tso.test.js.

  if(p[0]==='ld')return {op:'ld',reg:p[1],addr:p[2]};
  if(p[0]==='mfence')return {op:'mfence'};
  throw new Error('bad litmus op: '+line);

  const start={M:Object.fromEntries(addrs.map(a=>[a,0])),B:T.map(()=>[]),R:{},pc:T.map(()=>0)};

  while(stack.length){
    const s=stack.pop(),k=key(s);
    if(seen.has(k))continue;seen.add(k);
    const succ=[];
    for(let t=0;t<T.length;t++){
      const op=T[t][s.pc[t]];
      if(op){
        if(op.op==='st'){const n=clone(s);n.B[t]=[...n.B[t],[op.addr,op.val]];n.pc[t]++;succ.push(n);}
        else if(op.op==='ld'){const n=clone(s);const buf=[...n.B[t]].reverse().find(e=>e[0]===op.addr);n.R={...n.R,[op.reg]:buf?buf[1]:n.M[op.addr]};n.pc[t]++;succ.push(n);}

function questionReachable(test){

// cfg.js
// Control-flow-graph recovery.
//
// Given a function's machine-code bytes, recover its basic blocks and the
// edges between them the way a disassembler does: decode linearly, find the
// block leaders (the entry, every branch target, and every instruction that
// follows a branch or return), cut the instruction stream at those leaders,
// and connect each block to its successors. This is the structure every
// decompiler and RE tool builds before it can reason about a function.

function buildCFG({codeHex, dataHex = '', entry, base, textByAddr = {}}) {
  const m = new Machine(programFromImage({codeHex, dataHex, entry}));
  const end = base + codeHex.length / 2;
  const insns = [];

  while (addr < end) {
    m.rip = BigInt(addr);

    try { d = m.decode(); } catch (e) { break; }
    const next = Number(d.next);
    let kind = 'normal', target = null, cond = null;
    if (d.name === 'jmp') { kind = 'jmp'; target = Number(d.args[0].value); }
    else if (d.name === 'jcc') { kind = 'jcc'; target = Number(d.args[0].value); cond = d.args[1] && d.args[1].condition; }
    else if (d.name === 'ret') { kind = 'ret'; }
    else if (d.name === 'call') { kind = 'call'; if (d.args[0] && d.args[0].value !== undefined) target = Number(d.args[0].value); }
    insns.push({addr, next, kind, target, cond, text: textByAddr[addr] || d.name});

    addr = next;

  const present = new Set(insns.map(i => i.addr));
  const leaders = new Set([insns[0].addr]);
  for (const i of insns) {
    if (i.kind === 'jmp' || i.kind === 'jcc') {
      if (present.has(i.target)) leaders.add(i.target);
      if (present.has(i.next)) leaders.add(i.next);
    } else if (i.kind === 'ret') {
      if (present.has(i.next)) leaders.add(i.next);
    }
  }

  const blocks = leaderList.map((la, bi) => {
    const lb = leaderList[bi + 1] ?? end;
    const bins = insns.filter(i => i.addr >= la && i.addr < lb);
    return {id: bi, addr: la, insns: bins, last: bins[bins.length - 1]};
  });

  const edges = [];
  for (const b of blocks) {
    const last = b.last;
    if (!last || last.kind === 'ret') continue;

      if (t >= 0) edges.push({from: b.id, to: t, kind: 'jump'});

      const f = blockAt(last.next);
      if (f >= 0) edges.push({from: b.id, to: f, kind: 'fall'});
    }

  for (const e of edges) e.back = blocks[e.to].addr < blocks[e.from].addr;

// Linear-sweep disassembly: decode straight through the bytes, one instruction
// after the previous, ignoring control flow. Fast, and what a naive
// disassembler does — but foolable, because a jump can land mid-instruction so
// that the bytes a jump skips over are decoded as instructions that never run.
function linearSweep({codeHex, dataHex = '', entry, base}) {
  const m = new Machine(programFromImage({codeHex, dataHex, entry}));
  const end = base + codeHex.length / 2;
  const out = [];
  let addr = base;
  while (addr < end) {
    m.rip = BigInt(addr);
    let d;
    try { d = m.decode(); } catch (e) { out.push({addr, bad: true}); break; }
    const next = Number(d.next);
    out.push({addr, len: next - addr, name: d.name});
    if (next <= addr) break;
    addr = next;
  }
  return out;
}

// Recursive-descent disassembly: start at the entry and follow control flow —
// fallthrough, branch targets, and both sides of a conditional — decoding only
// bytes that are reachable as instruction starts. This recovers the code that
// actually runs, even when it overlaps the linear decoding.
function recursiveSweep({codeHex, dataHex = '', entry, base}) {
  const m = new Machine(programFromImage({codeHex, dataHex, entry}));
  const end = base + codeHex.length / 2;
  const seen = new Map();
  const work = [entry ?? base];
  while (work.length) {
    let addr = work.pop();
    while (addr >= base && addr < end && !seen.has(addr)) {
      m.rip = BigInt(addr);
      let d;
      try { d = m.decode(); } catch (e) { break; }
      const next = Number(d.next);
      seen.set(addr, {addr, len: next - addr, name: d.name});
      if (d.name === 'jmp') { if (d.args[0] && d.args[0].value !== undefined) work.push(Number(d.args[0].value)); break; }
      if (d.name === 'jcc') { if (d.args[0] && d.args[0].value !== undefined) work.push(Number(d.args[0].value)); addr = next; continue; }
      if (d.name === 'ret') break;
      if (next <= addr) break;
      addr = next;
    }
  }
  return [...seen.values()].sort((a, b) => a.addr - b.addr);

// Structure recovery.
//
// Given the base-relative memory accesses a function makes through a struct
// pointer — each an offset and a width — reconstruct the struct's layout: the
// widest access at each offset is the field size, the size implies a type, and
// the gaps between fields are the padding the compiler inserted for alignment.
// This is how a reverser turns [rdi+0xc] DWORD into "int at offset 12".
const TYPE = {1: 'int8 / char', 2: 'int16 / short', 4: 'int32', 8: 'int64 / pointer'};

function recoverStruct(accesses) {
  const byOff = new Map();
  for (const a of accesses) byOff.set(a.off, Math.max(byOff.get(a.off) || 0, a.size));
  const offs = [...byOff.keys()].sort((x, y) => x - y);
  const fields = [];
  let cursor = 0;
  for (const o of offs) {
    const size = byOff.get(o);
    if (o > cursor) fields.push({pad: true, off: cursor, size: o - cursor});
    fields.push({off: o, size, type: TYPE[size] || `${size} bytes`});
    cursor = o + size;
  }
  const align = Math.max(1, ...offs.map(o => byOff.get(o)));
  const size = Math.ceil(cursor / align) * align;
  if (size > cursor) fields.push({pad: true, off: cursor, size: size - cursor});
  return {fields, size, align};
}

// asan.js
// AddressSanitizer-style shadow memory.
//
// A sanitizer surrounds every allocation with poisoned "redzone" bytes and
// records, in a shadow map, which bytes are legitimately addressable. Each
// memory access consults the shadow: touching a poisoned byte is a reported
// error — even when the address is mapped and the CPU would not fault. That is
// how sanitizers catch the out-of-bounds reads and writes that otherwise
// silently return or corrupt adjacent data.

// Build a shadow map for one heap allocation framed by redzones.
// Returns {bytes:[{zone}], allocBase, allocSize} where zone is
// 'redzone' (poisoned) or 'alloc' (addressable).
function buildShadow({redzone = 16, alloc = 20} = {}) {
  const bytes = [];
  for (let i = 0; i < redzone; i++) bytes.push({zone: 'redzone'});
  for (let i = 0; i < alloc; i++) bytes.push({zone: 'alloc'});
  for (let i = 0; i < redzone; i++) bytes.push({zone: 'redzone'});
  return {bytes, allocBase: redzone, allocSize: alloc};
}

// Check an access at a byte offset (relative to the allocation base) of a given
// size. Returns {ok, kind, touched} where kind is 'ok', 'overflow', or
// 'underflow', and touched is the list of absolute shadow indices read/written.
function checkAccess(shadow, off, size) {
  const start = shadow.allocBase + off;
  const touched = [];
  let underflow = false, overflow = false;
  for (let i = start; i < start + size; i++) {
    touched.push(i);
    if (i < 0 || i >= shadow.bytes.length || shadow.bytes[i].zone === 'redzone') {
      if (i < shadow.allocBase) underflow = true; else overflow = true;
    }
  }
  const kind = overflow ? 'overflow' : underflow ? 'underflow' : 'ok';
  return {ok: kind === 'ok', kind, touched};
}

function readInput(){const s=$('#lab-input').value.trim();let v;if(/^-0x[\da-f]+$/i.test(s))v=-BigInt(s.slice(1));else if(/^[-+]?(\d+|0x[\da-f]+|0b[01]+)$/i.test(s))v=BigInt(s.replace(/^\+/,''));else throw new Error('Input must be a decimal, hexadecimal, or binary integer.');if(v<-(1n<<63n)||v>=(1n<<64n))throw new Error('Input must fit a signed or unsigned 64-bit integer.');return v;}
function saveDraft(){if(!current||!$('#source'))return;state.drafts[current.id]={source:$('#source').value,input:$('#lab-input').value};save();}
function markDirty(){stopRun();dirty=true;$('#dirty').classList.add('show');results=null;$('#verification').innerHTML='';updateStatus('Source or input changed. Build to load it.');updateButtons();saveDraft();updateLineNumbers();}

function updateButtons(){if(!$('#build'))return;$('#run').disabled=dirty||!machine||['halted','fault'].includes(machine.status);const atRest=dirty||!machine||running||['halted','fault'].includes(machine.status);$('#step').disabled=atRest;$('#over').disabled=atRest;$('#finish').disabled=atRest;$('#back').disabled=dirty||!machine?.history.length||running;$('#verify').disabled=running;$('#build').disabled=running;$('#run').innerHTML=icon(running?'pause':'play')+(running?'Pause':'Run');}
function updateStatus(text=null){const e=$('#machine-status');if(!e)return;const error=machine?.status==='fault',success=machine?.status==='halted';e.className=`status-line ${error?'error':success?'success':''}`;e.innerHTML=`<span class="status-dot"></span><span>${esc(text??machine?.reason??'Build your program to begin.')}</span><span class="stepcount">${machine?.steps??0} instructions</span>`;}
function build(){stopRun();try{const input=readInput();machine=createFixture(Machine,assemble,current,$('#source').value,input);dirty=false;breakpoints=new Set();watchpoints=new Set();$('#dirty').classList.remove('show');results=null;$('#verification').innerHTML='';saveDraft();renderExecution();}catch(e){machine=null;dirty=true;$('#disassembly-rows').innerHTML=`<tr><td colspan="4"><div class="engine-error">${esc(e.message)}</div></td></tr>`;$('#inspector-body').innerHTML='<p class="inspector-help">Fix the build error to inspect machine state.</p>';updateStatus(e.message);$('#machine-status').classList.add('error');updateButtons();}}
function renderDisassembly(){const body=$('#disassembly-rows');if(!machine){body.innerHTML='';return;}body.innerHTML=machine.program.instructions.map(r=>`<tr class="${BigInt(r.address)===machine.rip?'current':''}" data-address="${r.address}"><td><button class="bp ${breakpoints.has(r.address)?'on':''}" data-bp="${r.address}" aria-label="${breakpoints.has(r.address)?'Remove':'Set'} breakpoint at line ${r.line}" aria-pressed="${breakpoints.has(r.address)}"><span></span></button></td><td class="address">${hex(r.address,4)}</td><td class="bytes">${r.bytes.map(b=>hex(b,2)).join(' ')}</td><td class="insn">${esc(r.text)}</td></tr>`).join('');$$('[data-bp]').forEach(b=>b.onclick=()=>{const a=+b.dataset.bp;breakpoints.has(a)?breakpoints.delete(a):breakpoints.add(a);renderDisassembly();});}
const fmtF64=v=>{const d=bitsToF64(v&mask(64));if(!Number.isFinite(d))return String(d);if(Number.isInteger(d)&&Math.abs(d)<1e15)return String(d);return parseFloat(d.toPrecision(8)).toString();};
function renderRegisters(){const before=machine.history.at(-1)?.before;return `<div class="register-grid">${REG64.map((r,i)=>`<div class="register ${before&&before.regs[i]!==machine.regs[i]?'changed':''}" title="Unsigned: ${machine.regs[i]} · signed: ${signed(machine.regs[i])}"><span>${r}</span><span data-reg="${r}">${hex(machine.regs[i])}</span></div>`).join('')}<div class="register rip"><span>rip</span><span data-reg="rip">${hex(machine.rip)}</span></div></div>${machine.xmm&&machine.xmm.some(x=>x!==0n)?`<div class="xmm-grid">${machine.xmm.map((v,i)=>v!==0n?`<div class="register xmm" title="128-bit XMM — four int32 lanes (lane 0 = low, shown right to left) and the low 64 bits as a double"><span>xmm${i}</span><span class="xmm-lanes" data-xmm="${i}">${splitLanes(v,32).map(l=>`<i>${hex(l,8)}</i>`).reverse().join('')}</span><span class="xmm-f">${fmtF64(v)}</span></div>`:'').join('')}</div>`:''}<div class="flagrow">${Object.entries(machine.flags).map(([k,v])=>`<span class="flag ${v===null?'undefined':v?'on':''}" title="${v===null?'Architecturally undefined after this instruction':v?'Set':'Clear'}" data-flag="${k}">${k} ${v===null?'?':+v}</span>`).join('')}</div><p class="inspector-help">Hexadecimal · changed registers highlighted · hover for signed/unsigned values · ? = undefined flag</p>`;}
function memoryTable(base,rows=8){const changed=new Set(machine.writes.map(w=>w.address));return `<table class="memory-grid"><thead><tr><th>ADDRESS</th>${Array.from({length:8},(_,i)=>`<th>+${i}</th>`).join('')}<th>ASCII</th></tr></thead><tbody>${Array.from({length:rows},(_,r)=>{const a=base+r*8;return `<tr><td>${hex(a,4)}</td>${Array.from({length:8},(_,i)=>{const b=a+i;let mapped=true;try{machine.range(b,1);}catch{mapped=false;}return `<td class="memory-byte ${changed.has(b)?'changed':''} ${watchpoints.has(b)?'watched':''}">${mapped?hex(machine.memory[b],2):'··'}</td>`;}).join('')}<td class="ascii">${Array.from({length:8},(_,i)=>{let b=machine.memory[a+i];try{machine.range(a+i,1);}catch{b=0;}return b>=32&&b<=126?esc(String.fromCharCode(b)):'.';}).join('')}</td></tr>`;}).join('')}</tbody></table>`;}
function renderInspector(){
 const el=$('#inspector-body');if(!machine){el.innerHTML='<p class="inspector-help">Build the program to inspect its state.</p>';return;}
 if(inspectTab==='registers')el.innerHTML=renderRegisters();
 if(inspectTab==='memory'){
  el.innerHTML=`<div class="memory-controls"><label for="memory-address">Address</label><input id="memory-address" value="0x${memoryBase.toString(16)}" spellcheck="false"><button class="btn small" id="memory-go">Inspect</button><button class="btn small ghost" id="watch-toggle">${watchpoints.has(memoryBase)?'Remove watch':'Watch write'}</button><button class="btn small ghost" id="memory-stack">Stack</button></div>${memoryTable(memoryBase)}<p class="inspector-help">64 bytes · little-endian · ·· = unmapped · watch stops after a write to the selected byte.<br>${watchpoints.size?`Watching: <span class="watch-address">${[...watchpoints].map(a=>'0x'+a.toString(16)).join(', ')}</span>`:'No write watchpoints set.'}</p>`;
  $('#memory-go').onclick=()=>{const s=$('#memory-address').value.trim();if(!/^(0x[\da-f]+|\d+)$/i.test(s)){toast('Enter a hexadecimal or decimal address.');return;}const n=Number(s);if(!Number.isInteger(n)||n<0||n>0xffc0){toast('Inspect an address between 0x0000 and 0xffc0.');return;}memoryBase=n;renderInspector();};
  $('#memory-address').onkeydown=e=>{if(e.key==='Enter')$('#memory-go').click();};
  $('#watch-toggle').onclick=()=>{watchpoints.has(memoryBase)?watchpoints.delete(memoryBase):watchpoints.add(memoryBase);renderInspector();};
  $('#memory-stack').onclick=()=>{memoryBase=Math.min(0x7fc0,Math.max(0x7000,Number(machine.regs[4])&~7));renderInspector();};
 }
 if(inspectTab==='stack'){
  const sp=Number(machine.regs[4]);let rows='';for(let i=0;i<6;i++){const a=sp+i*8;let value;try{value=machine.readMem(a,64);}catch{break;}rows+=`<div class="stack-row"><span class="addr">0x${hex(a,4)} ${i===0?'← RSP':''}</span><span>${hex(value)}</span><small>${value===0xfff0n?'harness return':''}</small></div>`;}
  el.innerHTML=(rows||'<p class="inspector-help">No readable stack slots above the current RSP.</p>')+`<p class="inspector-help">Stack grows toward lower addresses. CALL/RET event depth: ${machine.calls.length}. This is an event record, not native stack unwinding.</p>`;
 }
 if(inspectTab==='history')el.innerHTML=machine.history.length?machine.history.slice(-12).reverse().map(h=>`<div class="trace-row"><span>#${h.before.steps+1}</span><span>0x${hex(h.before.rip,4)}</span><span>${h.instruction}${h.writes.length?` · ${h.writes.length} byte writes`:''}</span></div>`).join('')+'<p class="inspector-help">Most recent first. Back restores one state. Up to 512 steps retained.</p>':'<p class="inspector-help">Step or run to record instruction history.</p>';
 if(inspectTab==='output')el.innerHTML=`<pre class="output" id="console-output">${esc(machine.output||'No console bytes written.')}</pre><div class="rule"></div><p class="inspector-help">${esc(machine.reason)}<br>RAX = 0x${hex(machine.regs[0])} (${machine.regs[0]} unsigned)<br>The console models write/exit only. No host process or network.</p>`;
}
function renderExecution(){renderDisassembly();renderInspector();updateStatus();updateButtons();}
function singleStep(){if(dirty||!machine)return;machine.step();renderExecution();}
function stepOver(){if(dirty||!machine||running)return;machine.stepOver({breakpoints,watchpoints});renderExecution();}
function finishFrame(){if(dirty||!machine||running)return;machine.finish({breakpoints,watchpoints});renderExecution();}
function run(){
 if(running){stopRun();if(machine){machine.status='paused';machine.reason='Paused by you';}renderExecution();return;}
 if(!machine||dirty)return;running=true;const token=++runToken;let total=0;updateButtons();
 function tick(){if(!running||token!==runToken)return;const n=machine.run({limit:Math.min(200,10000-total),breakpoints,watchpoints,skipCurrent:total===0&&machine.reason==='Address breakpoint'});total+=n;const paused=!machine.reason.startsWith('Instruction budget');
  if(['halted','fault'].includes(machine.status)||paused||total>=10000){running=false;if(total>=10000&&!['halted','fault'].includes(machine.status))machine.reason='Instruction budget (10000) reached';renderExecution();return;}
  renderExecution();requestAnimationFrame(tick);
 }requestAnimationFrame(tick);
}

function elfView(){
 const bytes=b=>`<code class="elf-bytes">${esc(b)}</code>`;
 const segDesc={INTERP:'the path of the dynamic linker (ld.so), which runs before your code',LOAD:'mapped into memory by the kernel',DYNAMIC:'the tables ld.so reads to resolve imports',GNU_RELRO:'made read-only after relocation, to harden the GOT'};
 const loadByFlags={'R':'read-only metadata',"R E":'code — .text and the PLT','RW':'writable data — .data, .bss, and the GOT'};
 const secDesc={'.interp':'the ld.so path','.dynsym':'symbols resolved at runtime','.rela.dyn':'relocations for data references','.rela.plt':'relocations for the GOT — one per imported function','.plt':'the lazy-binding trampoline','.plt.sec':'per-function call stubs','.text':'your compiled code','.rodata':'constants and string literals','.got':'patched pointers to imports','.data':'initialized writable globals','.bss':'zero-initialized globals'};
 const seg=elf.segments.filter(s=>segDesc[s.type]);
 const segRows=seg.map(s=>`<tr><td class="mono">${esc(s.type)}</td><td class="mono">${esc(s.flags||'—')}</td><td class="mono">${esc(s.vaddr)}</td><td>${esc(s.type==='LOAD'?(loadByFlags[s.flags]||'a mapped segment'):segDesc[s.type])}</td></tr>`).join('');
 const secRows=elf.sections.map(s=>`<tr><td class="mono">${esc(s.name)}</td><td class="mono">${esc(s.addr)}</td><td>${esc(secDesc[s.name]||'')}</td></tr>`).join('');
 const stub=elf.pltStub.insns.map(i=>`<tr><td class="mono">${bytes(i.bytes)}</td><td class="mono">${esc(i.text)}</td></tr>`).join('');
 shell('elf','Linking & loading',`<div class="page-title"><div class="eyebrow">ELF · LINKING · LOADING</div><h1>From a file to a running process.</h1><p>A compiled program is an ELF file: a header, segments the kernel maps, and sections the linker fills in. The values below are from a real <code>gcc</code> build of the program on the right — a direct call to a local function and one call into libc, which is where the PLT and GOT come in.</p></div>
 <section class="elf-card"><div class="elf-split"><div><h2>The program</h2><pre class="elf-src">${elf.source.map(esc).join('\n')}</pre></div><div><h2>ELF header</h2><table class="elf-table"><tbody><tr><td>Class</td><td class="mono">${esc(elf.header.class)}</td></tr><tr><td>Type</td><td class="mono">${esc(elf.header.type.split(' (')[0])} — position-independent</td></tr><tr><td>Machine</td><td class="mono">x86-64</td></tr><tr><td>Entry</td><td class="mono">${esc(elf.header.entry)}</td></tr></tbody></table><p class="elf-note">Execution starts at the entry point — the C runtime's <code>_start</code>, not <code>main</code>. "DYN" means the file is position-independent: the loader can map it at any base.</p></div></div></section>
 <section class="elf-card"><h2>Segments — what the loader maps</h2><p class="elf-note">The kernel reads the program headers and maps each <code>LOAD</code> segment at its permissions. <code>INTERP</code> names the dynamic linker: <code class="mono">${esc(elf.interp)}</code>, which runs first and wires up the imports.</p><table class="elf-table"><thead><tr><th>Type</th><th>Flags</th><th>Vaddr</th><th></th></tr></thead><tbody>${segRows}</tbody></table></section>
 <section class="elf-card"><h2>Sections — what the linker uses</h2><p class="elf-note">Segments are the loader's view; sections are the linker's. The dynamic-linking machinery lives in <code>.plt</code>, <code>.got</code>, and <code>.rela.plt</code>.</p><table class="elf-table"><thead><tr><th>Section</th><th>Addr</th><th></th></tr></thead><tbody>${secRows}</tbody></table></section>
 <section class="elf-card"><h2>Two kinds of call</h2><p class="elf-note">Inside <code>main</code>, the call to the local <code>add</code> is a resolved relative call; the call to <code>printf</code> goes through a PLT stub.</p><table class="elf-table"><tbody><tr><td class="mono">${esc(elf.calls.direct.site)}</td><td>${bytes(elf.calls.direct.bytes)}</td><td class="mono">call ${esc(elf.calls.direct.target)}</td><td>direct — resolved at link time</td></tr><tr><td class="mono">${esc(elf.calls.plt.site)}</td><td>${bytes(elf.calls.plt.bytes)}</td><td class="mono">call ${esc(elf.calls.plt.target)}</td><td>through the PLT</td></tr></tbody></table></section>
 <section class="elf-card"><h2>The relocation behind the direct call</h2><p class="elf-note">In the object file, <code>call add</code> is a placeholder — a zeroed offset with a relocation entry. The linker fills in the relative offset once it knows where <code>add</code> landed. (This is why intra-module calls read as <code>e8 00000000</code> in a <code>.o</code>.)</p><table class="elf-table"><tbody><tr><td>in <code>.o</code> (unrelocated)</td><td>${bytes(elf.relocStory.obj)}</td></tr><tr><td>after linking</td><td>${bytes(elf.relocStory.linked)}</td></tr></tbody></table></section>
 <section class="elf-card"><h2>PLT &amp; GOT — lazy binding</h2><p class="elf-note">A call to an imported function jumps to its PLT stub, which jumps through a slot in the GOT:</p><table class="elf-table"><tbody>${stub}</tbody></table><p class="elf-note">That slot, <code class="mono">${esc(elf.pltStub.gotTarget)}</code>, is the target of a relocation:</p><table class="elf-table"><thead><tr><th>GOT offset</th><th>Type</th><th>Symbol</th></tr></thead><tbody><tr><td class="mono">${esc(elf.reloc.offset)}</td><td class="mono">${esc(elf.reloc.type)}</td><td class="mono">${esc(elf.reloc.symbol)}</td></tr></tbody></table><p class="elf-note">On the first call the GOT slot still points back into the PLT, which calls ld.so's resolver; it finds <code>printf</code>, writes its real address into the slot, and jumps there. Every later call reads the patched slot and goes straight to <code>printf</code> — one indirect jump, no resolver. The stub's jump target and the relocation's offset are the same address, which is how the trampoline and the fix-up meet.</p></section>`);
}

 shell('cfg','Control flow',`<div class="page-title"><div class="eyebrow">REVERSE ENGINEERING · CONTROL-FLOW GRAPH</div><h1>Recovering structure from bytes.</h1><p>A function is a linear stream of bytes, but it runs as a graph. Before a decompiler can recover an <code>if</code> or a loop, it finds the <strong>basic blocks</strong> — straight-line runs with one way in and one way out — and the edges between them. This graph is recovered from a real <code>gcc</code> build by decoding each instruction, marking every branch target and post-branch instruction as a block leader, and connecting the blocks.</p></div>

const overlapDemo={base:0x1000,bytes:['eb','03','b8','90','90','31','c0','c3'],
 linear:[{off:0,n:2,t:'jmp 0x1005'},{off:2,n:5,t:'mov eax, 0xc0319090'},{off:7,n:1,t:'ret'}],
 real:[{off:0,n:2,t:'jmp 0x1005'},{off:5,n:2,t:'xor eax, eax'},{off:7,n:1,t:'ret'}],pivot:5};
function decompView(){
 const strip=groups=>overlapDemo.bytes.map((by,i)=>{const gi=groups.findIndex(g=>i>=g.off&&i<g.off+g.n);return `<span class="dbyte g${gi%3}${i===overlapDemo.pivot?' pivot':''}" title="offset ${i}">${by}</span>`;}).join('');
 const listing=arr=>arr.map(x=>`<div class="dins"><span class="doff mono">0x${(overlapDemo.base+x.off).toString(16)}</span><span class="dbytes mono">${overlapDemo.bytes.slice(x.off,x.off+x.n).join(' ')}</span><code>${esc(x.t)}</code></div>`).join('');
 shell('decomp','Disassembly',`<div class="page-title"><div class="eyebrow">REVERSE ENGINEERING · DISASSEMBLY AMBIGUITY</div><h1>The same bytes, two programs.</h1><p>x86 instructions vary in length and are not self-synchronizing, so where you start decoding changes what you read. A <strong>linear sweep</strong> decodes straight through the bytes; <strong>recursive descent</strong> follows control flow. When a jump lands inside an instruction, the two disagree — and code can hide in the gap.</p></div>
 <div class="decomp-grid">
  <div class="decomp-pane"><h3>Linear sweep <span class="dtag bad">fooled</span></h3><div class="dstrip">${strip(overlapDemo.linear)}</div><div class="dlist">${listing(overlapDemo.linear)}</div></div>
  <div class="decomp-pane"><h3>Recursive descent <span class="dtag ok">real</span></h3><div class="dstrip">${strip(overlapDemo.real)}</div><div class="dlist">${listing(overlapDemo.real)}</div></div>
 </div>
 <div class="notice"><strong>Where they split.</strong> The byte <code>0x31</code> at 0x1005 is the opcode of the real <code>xor eax, eax</code>. But the decoy <code>mov</code> at 0x1002 is five bytes long, so a linear sweep swallows 0x1005 as the third byte of its immediate and never sees the xor. The <code>jmp 0x1005</code> at the top skips the decoy at run time — recursive descent follows it and recovers the real code. This overlap is how packers and malware hide instructions from naive disassemblers, and why production tools combine both strategies and still get it wrong on hostile code.</div>`);

function asanView(){
 const shadow=buildShadow({redzone:16,alloc:20});
 const strip=set=>`<div class="asan-strip">${shadow.bytes.map((b,i)=>`<span class="asan-cell ${b.zone}${set&&set.has(i)?' touched':''}"></span>`).join('')}</div>`;
 const examples=[{label:'read 8 at offset 0',off:0,size:8},{label:'read 8 at offset 12 (last valid bytes)',off:12,size:8},{label:'read 4 at offset 17 (one past the end)',off:17,size:4},{label:'read 1 at offset 20 (just past the end)',off:20,size:1},{label:'read 1 at offset −1 (before the start)',off:-1,size:1}];

 shell('asan','Sanitizer',`<div class="page-title"><div class="eyebrow">AUTOMATED BUG-FINDING · SHADOW MEMORY</div><h1>Catching the bug the CPU can’t.</h1><p>AddressSanitizer frames every allocation with poisoned <strong>redzones</strong> and records which bytes are addressable in a shadow map. Each access consults the shadow, so an out-of-bounds read or write that lands in <em>mapped</em> memory — one the CPU would never fault on — is still caught. That is how the sanitizer turns the silent OOB reads from the bounds and pointer-leak labs into loud, located errors.</p></div>
 <div class="asan-legendbar"><span><span class="asan-cell alloc"></span> addressable</span><span><span class="asan-cell redzone"></span> redzone (poisoned)</span><span><span class="asan-cell alloc touched"></span> touched by the access</span></div>
 <div class="asan-map-wrap"><div class="asan-maplabel">Shadow map — a ${shadow.allocSize}-byte allocation framed by ${shadow.allocBase}-byte redzones</div>${strip(null)}</div>
 <div class="asan-rows">${rows}</div>
 <div class="notice"><strong>Why this matters.</strong> The engine faults only when an address leaves mapped memory, so a read one past an array that lands on the next live object succeeds and returns the wrong bytes — exactly the aslr-leak and bounds cases. The redzone makes that access illegal in the shadow, so the sanitizer reports a heap-buffer-overflow with the offset, instead of letting the program continue corrupted. Fuzzing plus a sanitizer is the standard bug-finding pair: the fuzzer reaches the bug, the sanitizer makes it crash where it happens.</div>`);

function exploitView(){
 const stages=[{n:1,name:'Overflow',d:'An unbounded write runs past a stack buffer.'},{n:2,name:'Overwrite saved RIP',d:'The write reaches and replaces the saved return address.'},{n:3,name:'Redirect',d:'On return, control jumps to an attacker-chosen address.'},{n:4,name:'Payload runs',d:'Injected or reused code executes.'}];
 const mits=[
  {id:'canary',name:'Stack canary',sub:'-fstack-protector',breaks:2,d:'A random value placed between the buffer and the saved return address and checked in the epilogue. A contiguous overflow that reaches the return address must cross it first, so the corruption is caught before the function returns.',adapt:'Leak the canary and rewrite it in place, or find a write that skips over it.',lab:['stack-canary','Drive the canary lab']},
  {id:'nx',name:'NX / DEP',sub:'W^X',breaks:4,d:'Stack and heap pages are mapped non-executable, so bytes the attacker writes there cannot run as code.',adapt:'Reuse code that is already executable — return-oriented programming chains existing instruction fragments instead of injecting shellcode.',lab:null},

  {id:'cfi',name:'CFI / shadow stack',sub:'Intel CET',breaks:3,d:'Indirect calls are restricted to valid function entries, and a shadow stack verifies that each return goes back to where its call came from.',adapt:'Data-only attacks that corrupt a decision without diverting control flow, or gaps the policy does not cover.',lab:null}];
 const radios=mits.map(m=>`<input type="radio" name="xmit" id="xm-${m.id}" class="xpl-radio">`).join('');
 const chain=`<div class="xpl-chain">${stages.map((s,i)=>`${i?'<span class="xpl-arrow">▸</span>':''}<div class="xpl-stage s${s.n}"><span class="xpl-num">${s.n}</span><strong>${esc(s.name)}</strong><span>${esc(s.d)}</span></div>`).join('')}</div>`;
 const cards=mits.map(m=>`<label for="xm-${m.id}" class="xpl-card b${m.breaks}"><div class="xpl-chead"><strong>${esc(m.name)}</strong><span class="xpl-sub">${esc(m.sub)}</span><span class="xpl-breaks">breaks stage ${m.breaks}</span></div><p>${esc(m.d)}</p><p class="xpl-adapt"><em>Attacker adapts:</em> ${esc(m.adapt)}</p>${m.lab?`<a class="xpl-lab" href="#lab/${m.lab[0]}">${esc(m.lab[1])} →</a>`:''}</label>`).join('');
 shell('exploit','Exploitation',`<div class="page-title"><div class="eyebrow">EXPLOITATION · THE MITIGATION ARMS RACE</div><h1>The exploit, and the defenses that break it.</h1><p>A classic stack buffer overflow becomes code execution in four steps. Each modern mitigation breaks one of them — and each has an answer. Select a defense to light up the step it stops and read how attackers adapt. This is the mechanism and the defense; the memory-safety labs let you drive the individual pieces.</p></div>
 <form class="xpl">${radios}${chain}<div class="xpl-mits">${cards}</div></form>
 <div class="notice"><strong>Defense in depth.</strong> No single mitigation is sufficient — each forces an adaptation the next is meant to block. Canaries catch contiguous overwrites, NX forces code reuse, ASLR forces an information leak, CFI constrains where reused code can land. Modern exploitation chains answers to all of them at once, which is why memory-safe languages — removing step 1 entirely — are the real fix.</div>`);

function reference(){shell('reference','Engine reference',`<div class="page-title"><div class="eyebrow">KNOW YOUR INSTRUMENT</div><h1>What this machine does.</h1><p>Real x86-64 instruction encodings, executed by an explicitly bounded teaching engine. Understand the model before drawing conclusions from it.</p></div><article class="prose"><h2>Execution model</h2><p>The assembler emits machine-code bytes, resolves labels, and maps instructions to source lines. The executor decodes bytes at RIP; it does not merely animate source text. Registers use BigInt for exact 64-bit integers. Execution is single-threaded, deterministic, and limited by an instruction budget.</p><p>This is not a complete x86 CPU, Linux VM, C/C++ compiler, or native debugger. It models the subset below, a small address map, and two successful syscall cases. It does not measure your processor, implement timing, or run operating-system/kernel experiments.</p><h2>Supported instruction families</h2><table><thead><tr><th>Family</th><th>Instructions</th><th>Boundaries</th></tr></thead><tbody><tr><td>Data</td><td>MOV, LEA</td><td>Register/immediate and register/memory forms. No memory-to-memory MOV.</td></tr><tr><td>Arithmetic</td><td>ADD, SUB, CMP, INC, DEC, NEG, IMUL</td><td>IMUL is the two-operand 16/32/64-bit form. No division or carry-chain instructions.</td></tr><tr><td>Logic</td><td>AND, OR, XOR, TEST, NOT</td><td>8/16/32/64-bit widths.</td></tr><tr><td>Shifts</td><td>SHL, SHR, SAR</td><td>Immediate counts. Undefined flags display ?.</td></tr><tr><td>Control</td><td>JMP, Jcc, CALL, RET, NOP, INT3</td><td>Direct near label branches. No indirect branches or privileged instructions.</td></tr><tr><td>Stack</td><td>PUSH, POP</td><td>64-bit registers; PUSH also accepts a signed 32-bit immediate.</td></tr><tr><td>Boundary</td><td>SYSCALL</td><td>Modeled Linux x86-64 write(1) to stdout/stderr and exit(60), only.</td></tr></tbody></table><h2>Registers, flags, and addresses</h2><ul><li>RAX–R15 and their 32/16/low-8-bit views. Writes to a 32-bit register zero the upper half. AH/BH/CH/DH are not supported.</li><li>CF, PF, AF, ZF, SF, OF. Undefined flags are represented explicitly; using an undefined condition causes a teaching-engine fault.</li><li>Memory expressions: base + index × 1/2/4/8 + signed 32-bit displacement. Address registers are 64-bit. No RIP-relative, segment, or address-size-override forms.</li><li>Mapped code is read-only/executable. Data and stack are writable/non-executable. These are fixture permissions, not a full page-table implementation.</li></ul><table><thead><tr><th>Region</th><th>Addresses</th><th>Behavior</th></tr></thead><tbody><tr><td>Code</td><td>0x1000 to the assembled code end (below 0x2000)</td><td>RX, at most 4 KiB</td></tr><tr><td>Data</td><td>0x2000–0x3fff</td><td>RW, zero-initialized outside declared data</td></tr><tr><td>Stack</td><td>0x7000–0x7fff</td><td>RW; initial RSP 0x7ff8</td></tr><tr><td>Harness return</td><td>0xfff0</td><td>Synthetic sentinel; RET to it ends the function</td></tr></tbody></table><h2>Debugger behavior</h2><p>Step executes exactly one machine instruction. Over runs a called function to completion and stops at the instruction after the call; Finish runs to the current function’s return. Breakpoints and watchpoints still stop execution inside a stepped-over or finished region. Address breakpoints stop before an instruction. Write watchpoints stop after an instruction touches the selected byte. Back restores registers, flags, memory writes, output, and call-event state for the most recent 512 steps. Build resets the machine and clears breakpoints/watches. Run yields to the browser between instruction batches and stops after 10,000 instructions.</p><h2>Source and input</h2><p>Use Intel syntax with destination first. Labels and register names are case-insensitive. Semicolon and # introduce comments outside quoted literals. The .text/.data sections and .byte/.quad/.zero/.ascii/.asciz data directives are supported. Memory sizes are byte, word, dword, or qword ptr. Source is limited to 64,000 characters. Input accepts decimal/hex/binary integers fitting 64 bits.</p><h2>Honest limits</h2><p>Source-to-machine mappings describe this assembler, not compiler optimization or DWARF. The call list records CALL/RET events; it cannot reconstruct an arbitrary corrupted native call stack. Modeled WRITE completes in full and does not reproduce real short writes, signals, errno, or file descriptors. Flags and instruction behaviors are checked against native x86-64 in the repository tests, but that is evidence for the tested subset, not full CPU conformance.</p><p>There is no native C compiler in the browser release. The repository includes separate native C investigations and GNU assembly export. Future kernel, TrustZone, fuzzing, and PMU laboratories need their own validated runtime. Their syllabus is retained in the curriculum.</p><h2>References and project files</h2><p>${external(sources.intel.url,sources.intel.label)}<br>${external(sources.abi.url,sources.abi.label)}<br>${external(sources.gas.url,sources.gas.label)}</p><p><a class="textlink" href="./docs/ENGINE.md">Detailed engine contract</a> · <a class="textlink" href="./docs/CURRICULUM.md">Coverage ledger</a> · <a class="textlink" href="./README.md">Project README</a></p></article>`);}
